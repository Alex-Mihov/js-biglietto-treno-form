<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Style -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
    <header>
        <h1>Calcolo Biglietto</h1>
    </header>

    <form action="">
        <!-- input per nome e cognome -->
        <label for="nome">Nome e Cognome:</label>
        <input type="text" id="nome" placeholder="Inserisci nome e cognome" required>
        <!-- input per chilometri da percorrere -->
        <label for="km">Chilometri da percorrere:</label>
        <input type="number" id="km"  placeholder="Inserisci i chilometri da percorrere" min="0" required>
        <!-- input età -->
        <label for="eta">Età:</label>
        <input type="number" id="eta" placeholder="Inserisci la tua età" min="0" required>
        
        <button type="submit">Invia</button>

    </form>

    <!-- output nome -->
    <p>
        <strong>Nome e Cognome:</strong>
        <span id="acquirente">--</span>
    </p>
    <!-- output sconto applicato -->
    <p>
        <strong>Sconto Applicato:</strong>
        <span id="sconto">--</span>
    </p>
    <!-- output prezzo finale -->
    <p>
        <strong>Prezzo finale (€):</strong>
        <span id="prezzo-finale">--</span>
    </p>

    <script src="./js/biglietto.js"></script>
</body>
</html>
